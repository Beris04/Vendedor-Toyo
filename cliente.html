<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pedido digital Toyo Foods</title><style>
:root{--navy:#0b172a;--blue:#124f9f;--ink:#0f172a;--muted:#64748b;--line:#dbe5f2;--bg:#f5f7fb;--card:#ffffff;--soft:#eef3f9;--good:#0f766e;--warn:#b45309;--bad:#991b1b;--slate:#334155}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);font-size:13px}.topbar{background:var(--navy);color:white;padding:16px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 8px 22px rgba(15,23,42,.15)}.logo{width:54px;height:54px;border-radius:14px;background:white;padding:5px}.brand h1{margin:0;font-size:22px;letter-spacing:.2px}.brand small{color:#cbd5e1}.session{margin-left:auto;display:flex;gap:8px;align-items:center}.session select,.session input{border:1px solid #334155;background:#fff;color:#111827;border-radius:12px;padding:9px 12px;font-weight:700}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 86px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:86px;height:calc(100vh - 86px)}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:14px;margin-bottom:8px;font-weight:800;color:#334155;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eaf1fb;color:#0b3f82}.main{padding:20px;max-width:1500px}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,.04);margin-bottom:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.kpi small{text-transform:uppercase;color:#64748b;font-weight:900;font-size:11px;letter-spacing:.08em}.kpi b{display:block;font-size:25px;margin-top:8px}.kpi.good b{color:var(--good)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}h2{margin:0 0 14px;font-size:19px}h3{margin:0 0 10px;font-size:16px}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:14px}.filters input,.filters select,.field,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;font:inherit;color:var(--ink)}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eef2ff;color:#1e3a8a}.pill.good{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.list-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.list-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:70px}.item .code{font-weight:900;font-size:12px;color:#0b2545;white-space:pre}.item .name{font-size:12px;line-height:1.25}.item .meta{font-size:11px;color:var(--muted);margin-top:5px}.prod-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.prod{border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;display:grid;grid-template-columns:45px 1fr;gap:9px;align-items:center}.prod img{width:45px;height:45px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.prod b{font-size:12px;white-space:pre-wrap}.prod span{font-size:11px;color:#64748b}.qtyrow{grid-column:1/-1;display:flex;gap:8px;align-items:center}.qtyrow input{width:64px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.btn{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px}.btn.primary{background:#0f3f7a;color:#fff;border-color:#0f3f7a}.btn.dark{background:#111827;color:#fff;border-color:#111827}.btn.good{background:#0f766e;color:#fff;border-color:#0f766e}.btn.ghost{background:#f8fafc}.btn:hover{filter:brightness(.96)}.actions{display:flex;flex-wrap:wrap;gap:10px}.summary{background:#111827;color:#fff;border-radius:20px;padding:18px}.summary .k{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}.summary b{color:#fff}.order-preview{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;min-height:130px;font-family:Consolas,monospace;font-size:12px}.bar{display:grid;grid-template-columns:220px 1fr 60px;gap:10px;align-items:center;margin:8px 0}.barname{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bartrack{height:16px;background:#e2e8f0;border-radius:999px;overflow:hidden}.barfill{height:100%;background:#0f3f7a;border-radius:999px}.barpct{text-align:right;font-weight:900}.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th{text-align:left;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.07em}.table td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;font-size:12px}.table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}.strategy{border-left:4px solid #0f3f7a;background:#f8fafc;border-radius:14px;padding:14px;margin:8px 0}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.client-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.client-head h2{font-size:24px;margin-bottom:4px}.danger-text{color:#991b1b}.ok-text{color:#0f766e}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{position:relative;top:0;height:auto;display:flex;overflow:auto}.navbtn{white-space:nowrap}.grid4,.grid3,.grid2,.filters,.split,.prod-grid,.list-grid-3,.list-grid-2{grid-template-columns:1fr}.main{padding:12px}}
 body{background:#e8edf5}.doc{max-width:1120px;margin:0 auto;background:white;min-height:100vh}.hero{background:#0f3f7a;color:white;padding:28px 36px;display:flex;gap:16px;align-items:center}.hero img{width:70px;height:70px;border-radius:17px;background:#fff;padding:6px}.hero h1{font-size:34px;margin:0}.content{padding:30px 36px}.info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}.box{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:16px}.box small{display:block;color:#64748b;text-transform:uppercase;font-weight:900;letter-spacing:.08em;margin-bottom:6px}.box b{font-size:18px}@media print{.actions{display:none}.doc{box-shadow:none}}</style></head><body><div class="doc"><div class="hero"><img src="assets/toyo_logo.png"><div><small>TOYO FOODS</small><h1>Pedido digital</h1><div>Documento generado: <span id="date"></span></div></div></div><div class="content"><div class="info"><div class="box"><small>Cliente</small><b id="client"></b></div><div class="box"><small>Código cliente</small><b id="code"></b></div><div class="box"><small>Vendedor</small><b id="vendor"></b></div><div class="box"><small>Atendió</small><b id="user"></b></div></div><table class="table"><thead><tr><th>Código</th><th>Descripción</th><th>Categoría</th><th>Piezas</th></tr></thead><tbody id="tbody"></tbody></table><div class="grid2"><div class="summary"><small>Productos</small><b id="totalProd" style="font-size:36px"></b></div><div class="summary"><small>Piezas</small><b id="totalPzas" style="font-size:36px"></b></div></div><div class="actions" style="margin-top:24px"><button class="btn primary" onclick="window.print()">Imprimir / PDF</button><button class="btn" onclick="window.close()">Cerrar</button></div></div></div><script>
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function init(){let saved=JSON.parse(localStorage.getItem('last_order')||'{}');let c=saved.client||{};let order=saved.order||[];document.getElementById('client').textContent=c.name||'Sin cliente';document.getElementById('code').textContent=c.code||'';document.getElementById('vendor').textContent=c.vendor||'';document.getElementById('user').textContent=saved.user||'';document.getElementById('date').textContent=saved.created||new Date().toLocaleString('es-MX');document.getElementById('tbody').innerHTML=order.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.cat||'')}</td><td>${p.qty}</td></tr>`).join('')||'<tr><td colspan="4">Sin productos capturados</td></tr>';document.getElementById('totalProd').textContent=order.length;document.getElementById('totalPzas').textContent=order.reduce((a,b)=>a+Number(b.qty||0),0)}
window.onload=init;
</script></body></html>
