<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATN Clientes | Toyo Foods</title>
<style>
:root{--azul:#003b73;--rojo:#d9281b;--bg:#f4f7fb;--card:#fff;--text:#102033;--muted:#64748b;--line:#dbe4f0;--ok:#059669;--warn:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}header{background:linear-gradient(135deg,var(--azul),#062447);color:white;padding:16px}.bar{max-width:1450px;margin:auto;display:flex;align-items:center;gap:13px}.logo{width:56px;height:56px;border-radius:16px;background:white;color:var(--azul);display:grid;place-items:center;font-weight:900;box-shadow:0 10px 25px #0004}h1{font-size:23px;margin:0}.sub{color:#d7e8ff;margin:3px 0 0}.wrap{max-width:1450px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px #08345d0d}.card{padding:14px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}.kpi{padding:12px}.kpi b{font-size:24px;display:block}.kpi span,.muted{color:var(--muted);font-size:13px}.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}button,.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;background:var(--azul);color:white}.btn.red{background:var(--rojo)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.light{background:#e8eef7;color:var(--azul)}.list{max-height:68vh;overflow:auto;display:grid;gap:8px}.client{padding:10px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:white}.client:hover,.client.active{border-color:var(--azul);box-shadow:0 0 0 3px #003b7320}.client b{display:block}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef4ff;color:var(--azul);font-size:12px;font-weight:700;margin:4px 4px 0 0}.pill.red{background:#ffeceb;color:#9d1d16}.pill.ok{background:#e9fbf4;color:#047857}.topline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.cols{display:grid;grid-template-columns:1fr 380px;gap:14px}.section{margin-top:12px}.items{display:grid;gap:8px}.prod{display:grid;grid-template-columns:54px 1fr 84px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}.prod img{width:54px;height:54px;object-fit:contain;border-radius:10px;background:#f1f5f9}.prod .code{font-size:12px;color:var(--azul);font-weight:900}.prod .name{font-size:13px;font-weight:700}.qty{padding:8px;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.copybox{height:105px}.orderline{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0}.acgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.ac{padding:12px;border-radius:16px;background:white;border:1px solid var(--line)}.ac b{display:block}.small{font-size:12px;color:var(--muted)}@media(max-width:980px){.grid,.cols{grid-template-columns:1fr}.kpis,.acgrid{grid-template-columns:repeat(2,1fr)}.list{max-height:360px}.prod{grid-template-columns:45px 1fr 72px}.prod img{width:45px;height:45px}}@media(max-width:560px){.kpis,.acgrid{grid-template-columns:1fr}h1{font-size:19px}.wrap{padding:10px}.card{padding:11px}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">TOYO</div><div><h1>Monitor Atención a Clientes</h1><div class="sub">Historial Oct–Abril · Recompra · Pedido rápido · Seguimiento</div></div></div></header>
<div class="wrap">
  <div class="acgrid" id="acCards"></div>
  <div class="kpis"><div class="kpi"><b id="kClients">0</b><span>Clientes</span></div><div class="kpi"><b id="kProducts">0</b><span>Productos visibles</span></div><div class="kpi"><b id="kOpp">0</b><span>Oportunidades</span></div><div class="kpi"><b id="kOrders">0</b><span>Pedidos guardados</span></div><div class="kpi"><b id="kMeet">0</b><span>Degustaciones</span></div></div>
  <div class="grid"><aside class="card"><div class="filters"><input id="q" placeholder="Buscar cliente, código o vendedor"><select id="acFilter"><option value="">Todas las chicas AC</option></select><select id="vendorFilter"><option value="">Todos los vendedores / rutas</option></select><button class="btn light" id="clear">Limpiar filtros</button></div><div class="list" id="clients"></div></aside><main id="detail"></main></div>
</div>
<script src="data.js"></script>
<script>
const DATA=window.ATN_DATA||{clients:[],acs:[],popular:[]};
const $=id=>document.getElementById(id);let state={q:'',ac:'',vendor:'',selected:null,cart:{}};let logs=JSON.parse(localStorage.getItem('atn_logs')||'[]');
function acBy(id){return DATA.acs.find(a=>a.id===id)||DATA.acs[0]||{name:'AC',email:'',phone:''}}
function filtered(){let q=state.q.trim().toLowerCase();return DATA.clients.filter(c=>(!state.ac||c.ac===state.ac)&&(!state.vendor||c.vendor===state.vendor)&&(!q||[c.name,c.code,c.vendor,c.warehouse].join(' ').toLowerCase().includes(q)))}
function opps(c){let bought=new Set((c.products||[]).map(p=>p.code));return (DATA.popular||[]).filter(p=>!bought.has(p.code)).slice(0,12)}
function renderFilters(){DATA.acs.forEach(a=>$('acFilter').insertAdjacentHTML('beforeend',`<option value="${a.id}">${a.name}</option>`));[...new Set(DATA.clients.map(c=>c.vendor).filter(Boolean))].sort().forEach(v=>$('vendorFilter').insertAdjacentHTML('beforeend',`<option>${v}</option>`))}
function renderAC(){let html=DATA.acs.map(a=>{let n=DATA.clients.filter(c=>c.ac===a.id).length;return `<div class="ac"><b>${a.name}</b><div class="small">${a.email}</div><div class="small">${a.phone}</div><span class="pill">${n} clientes</span></div>`}).join('');$('acCards').innerHTML=html}
function renderClients(){let arr=filtered();$('clients').innerHTML=arr.slice(0,700).map(c=>`<div class="client ${state.selected&&state.selected.code===c.code?'active':''}" onclick="selectClient('${c.code}')"><b>${c.name}</b><span class="small">${c.code} · ${c.vendor||''}</span><br><span class="pill">${(c.products||[]).length} productos</span><span class="pill red">${opps(c).length} sugeridos</span></div>`).join('')+(arr.length>700?`<div class="small">Mostrando 700 de ${arr.length}. Usa búsqueda para filtrar.</div>`:'');$('kClients').textContent=arr.length.toLocaleString('es-MX');$('kProducts').textContent=arr.reduce((s,c)=>s+(c.products||[]).length,0).toLocaleString('es-MX');$('kOpp').textContent=arr.reduce((s,c)=>s+opps(c).length,0).toLocaleString('es-MX');$('kOrders').textContent=logs.filter(l=>l.type==='pedido').length;$('kMeet').textContent=logs.filter(l=>l.type==='degustacion').length}
window.selectClient=code=>{state.selected=DATA.clients.find(c=>c.code===code);state.cart={};location.hash='cliente='+encodeURIComponent(code);renderClients();renderDetail()}
function img(p){return p.img||'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#eef2f7"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#64748b">SIN IMG</text></svg>`)}
function prodRow(p,tag='Historial'){return `<div class="prod"><img src="${img(p)}" loading="lazy"><div><div class="code">${p.code}</div><div class="name">${p.name}</div><span class="pill ${tag==='Sugerido'?'red':'ok'}">${tag}</span></div><input class="qty" type="number" min="0" placeholder="Cant." value="${state.cart[p.code]||''}" oninput="setQty('${p.code}', this.value, '${(p.name||'').replaceAll("'",'’')}')"></div>`}
window.setQty=(code,val,name)=>{let n=Number(val||0); if(n>0) state.cart[code]={code,name,qty:n}; else delete state.cart[code]; renderSummary()}
function copyMsg(c){let list=opps(c).slice(0,8).map(p=>`- ${p.code} ${p.name}`).join('\n');return `${c.name}, veo que no ha hecho la compra de estos artículos:\n${list}\n\n¿Quiere que le agregue en su próximo pedido alguno de estos?\n\nAtte. Atención a Clientes.`}
function renderSummary(){let c=state.selected;if(!c)return;let lines=Object.values(state.cart);$('summary').value=lines.length?`Cliente: ${c.name}\nCódigo: ${c.code}\nAtiende: ${acBy(c.ac).name}\n\nPedido:\n`+lines.map(x=>`${x.qty} x ${x.code} - ${x.name}`).join('\n'):'Sin productos capturados todavía.'}
function renderDetail(){let c=state.selected||filtered()[0]; if(!c){$('detail').innerHTML='<div class="card">No hay clientes con ese filtro.</div>';return} state.selected=c;let ac=acBy(c.ac), o=opps(c);$('detail').innerHTML=`<div class="card"><div class="topline"><div><h2 style="margin:0">${c.name}</h2><div class="muted">${c.code} · ${c.vendor||''} · ${c.warehouse||''}</div><span class="pill">${ac.name}</span><span class="pill">${ac.email}</span></div><div class="actions"><button class="btn" onclick="copyText(copyMsg(state.selected))">Copiar recompra</button><button class="btn ok" onclick="saveLog('degustacion')">Agendar degustación</button><button class="btn red" onclick="shareClient()">Copiar link cliente</button></div></div><div class="cols"><section><div class="section"><h3>Pedido rápido</h3><div class="items">${(c.products||[]).slice(0,45).map(p=>prodRow(p,'Historial')).join('')}</div></div><div class="section"><h3>Productos que puede recuperar / sugerir</h3><div class="items">${o.map(p=>prodRow(p,'Sugerido')).join('')}</div></div></section><aside><div class="card"><h3>Texto de recompra</h3><textarea class="copybox" readonly>${copyMsg(c)}</textarea><button class="btn" onclick="copyText(copyMsg(state.selected))">Copiar solo texto</button></div><div class="card section"><h3>Promociones a recomendar</h3><div class="pill red">3+1 productos seleccionados</div><div class="pill red">Degustación con cliente</div><div class="pill red">Producto nuevo / temporada</div><p class="small">Puedes editar esta sección después con promociones reales del mes.</p></div><div class="card section"><h3>Resumen de pedido</h3><textarea id="summary" class="copybox"></textarea><div class="actions"><button class="btn ok" onclick="mailtoOrder()">Enviar correo</button><button class="btn" onclick="whatsOrder()">WhatsApp AC</button><button class="btn warn" onclick="saveLog('pedido')">Guardar seguimiento</button></div><p class="small">Correo automático real requiere Formspree, EmailJS, Google Forms o Supabase. Esta versión abre el correo ya preparado.</p></div></aside></div></div>`;renderSummary()}
window.copyMsg=copyMsg;function copyText(t){navigator.clipboard?.writeText(t);alert('Texto copiado')}
function saveLog(type){let c=state.selected;logs.push({type,date:new Date().toISOString(),client:c.name,code:c.code,ac:acBy(c.ac).name,cart:Object.values(state.cart)});localStorage.setItem('atn_logs',JSON.stringify(logs));renderClients();alert(type==='pedido'?'Seguimiento guardado':'Degustación registrada')}
function mailtoOrder(){let c=state.selected, ac=acBy(c.ac), body=encodeURIComponent($('summary').value);location.href=`mailto:${ac.email}?subject=${encodeURIComponent('Pedido cliente '+c.code+' '+c.name)}&body=${body}`}
function whatsOrder(){let c=state.selected, ac=acBy(c.ac), phone=(ac.phone||'').replace(/\D/g,'');let text=encodeURIComponent($('summary').value);window.open(`https://wa.me/${phone}?text=${text}`,'_blank')}
function shareClient(){copyText(location.origin+location.pathname+'#cliente='+encodeURIComponent(state.selected.code))}
$('q').oninput=e=>{state.q=e.target.value;renderClients();renderDetail()};$('acFilter').onchange=e=>{state.ac=e.target.value;renderClients();renderDetail()};$('vendorFilter').onchange=e=>{state.vendor=e.target.value;renderClients();renderDetail()};$('clear').onclick=()=>{state={q:'',ac:'',vendor:'',selected:null,cart:{}};$('q').value='';$('acFilter').value='';$('vendorFilter').value='';renderClients();renderDetail()}
function init(){renderFilters();renderAC();let m=location.hash.match(/cliente=([^&]+)/);if(m){let code=decodeURIComponent(m[1]);state.selected=DATA.clients.find(c=>c.code===code)||null}renderClients();renderDetail()}init();
</script>
</body></html>
