<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ATN Clientes 1.0 | Toyo Foods</title><script src="data.js"></script>
<style>
:root{--navy:#0b2341;--navy2:#102f55;--blue:#1d4f86;--red:#b91c1c;--green:#16803c;--amber:#b7791f;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#d9e1ea;--soft:#eef3f8;}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--navy),#061426);color:white;padding:20px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:22px;letter-spacing:.5px}.sub{font-size:12px;color:#b9c7d8;margin-top:4px}.nav{margin-top:28px;display:flex;flex-direction:column;gap:8px}.nav button,.portal{width:100%;padding:12px;border:0;border-radius:10px;text-align:left;background:transparent;color:#dbe7f4;cursor:pointer;font-weight:600;text-decoration:none;display:block}.nav button.active,.nav button:hover,.portal:hover{background:rgba(255,255,255,.11);color:#fff}.main{padding:22px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title h1{margin:0;font-size:24px;color:var(--navy)}.title p{margin:4px 0 0;color:var(--muted)}.filters{display:flex;gap:10px;align-items:center}.input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;min-height:38px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy2);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef3f8;color:var(--navy);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:#9f1239}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(160px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(15,35,65,.06);padding:16px}.kpi-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.kpi-value{font-size:26px;font-weight:800;color:var(--navy);margin-top:8px}.kpi-note{color:var(--muted);font-size:12px;margin-top:5px}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:16px;margin:0 0 12px;color:var(--navy)}h3{font-size:14px;margin:0 0 10px;color:var(--navy)}.barrow{display:grid;grid-template-columns:180px 1fr 64px;gap:10px;align-items:center;margin:10px 0}.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155}.barbg{height:12px;background:#e7edf4;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#16395f,#2c6da4);border-radius:999px}.tbl-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;color:#334155;font-size:12px;text-transform:uppercase}.risk{font-weight:800;border-radius:999px;padding:4px 8px;font-size:12px}.risk.alto{background:#fee2e2;color:#991b1b}.risk.medio{background:#fef3c7;color:#92400e}.risk.bajo{background:#dcfce7;color:#166534}.section{display:none}.section.active{display:block}.client-layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.client-list{max-height:720px;overflow:auto}.client-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:white;cursor:pointer}.client-item.active{border-color:var(--blue);background:#eef6ff}.muted{color:var(--muted)}.pill{display:inline-flex;border-radius:999px;background:#eef3f8;padding:4px 8px;margin:2px;color:#334155;font-size:11px}.scroll-panel{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfdff}.product-card{display:grid;grid-template-columns:80px 1fr 70px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:white}.prod-code{font-family:Consolas,monospace;color:var(--navy);font-weight:800}.prod-name{font-weight:700;line-height:1.25}.prod-cat{font-size:11px;color:var(--muted);margin-top:3px}.qty{width:64px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.branch-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.branch-buttons .btn{padding:12px 8px}.modal{position:fixed;inset:0;background:rgba(3,10,18,.55);display:none;align-items:center;justify-content:center;z-index:20}.modal.open{display:flex}.modal-card{background:white;border-radius:18px;width:min(980px,94vw);max-height:86vh;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:16px;max-height:70vh;overflow:auto}.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{font-size:12px}.summary{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px;min-height:180px;font-family:Consolas,monospace;overflow:auto}.heat{display:grid;grid-template-columns:180px repeat(6,1fr);gap:4px;align-items:center}.cell{height:26px;border-radius:6px;background:#e2e8f0;text-align:center;font-size:11px;line-height:26px}.cell.good{background:#dcfce7;color:#166534}.cell.mid{background:#fef3c7;color:#92400e}.cell.bad{background:#fee2e2;color:#991b1b}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.client-layout,.two,.three,.kpis{grid-template-columns:1fr}.branch-buttons{grid-template-columns:1fr 1fr}.catalog-grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">TOYO FOODS</div><div class="sub">ATN Clientes 1.0 · Oficina GDL</div><div style="margin-top:18px"><label class="mini">Inicio de sesión Atención a Clientes</label><select id="userSelect" style="width:100%;margin-top:6px"></select><a class="portal" href="https://beris04.github.io/Toyo-MX/" target="_blank">Portal de Pedidos</a></div><nav class="nav"><button class="active" data-tab="dashboard">Dashboard Ejecutivo</button><button data-tab="clientes">Clientes</button><button data-tab="pedido">Pedido SAP</button><button data-tab="seguimiento">Seguimiento</button></nav></aside><main class="main"><section id="dashboard" class="section active"></section><section id="clientes" class="section"></section><section id="pedido" class="section"></section><section id="seguimiento" class="section"></section></main></div><div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><strong>Agregar producto del catálogo</strong><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="modal-body"><div class="filters"><input id="catalogSearch" class="input" placeholder="Buscar código o producto" oninput="renderCatalog()"><select id="catalogCat" onchange="renderCatalog()"></select></div><div id="catalogList" class="catalog-grid" style="margin-top:14px"></div></div></div></div>
<script>
const D=window.ATN_DATA; let selectedClient=null; let order=[]; let recoveryLog=JSON.parse(localStorage.getItem('atn_recovery')||'[]');
const monthNames=['','Ene','Feb','Mar','Abr','May','Jun'];
function $(id){return document.getElementById(id)}function fmt(n){return (n||0).toLocaleString('es-MX')}function pct(n){return (n||0).toFixed(1)+'%'}
function init(){D.users.forEach(u=>$('userSelect').insertAdjacentHTML('beforeend',`<option>${u}</option>`));document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));selectedClient=D.clients[0];renderAll()}
function showTab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==t));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==t));renderAll()}
function currentClient(){return selectedClient||D.clients[0]}
function riskClass(lost,hist){let r=hist?lost/hist:0;return r>.35?'alto':r>.15?'medio':'bajo'}
function riskText(cls){return cls=='alto'?'Alto':cls=='medio'?'Medio':'Bajo'}
function renderAll(){renderDashboard();renderClientes();renderPedido();renderSeguimiento()}
function renderDashboard(){const c=currentClient(); const active=c.categorias_activas.length, hist=c.categorias.length, lost=c.categorias_perdidas.length; const cov=hist?active/hist*100:0; const top=D.categoryStats.slice(0,10); $('dashboard').innerHTML=`<div class="top"><div class="title"><h1>Dashboard Ejecutivo</h1><p>Inteligencia comercial por categoría · ${D.meta.periodo}</p></div><div class="filters"><input class="input" id="dashClientSearch" placeholder="Buscar cliente" value="${c.nombre.replace(/"/g,'&quot;')}" oninput="searchDashClient(this.value)"></div></div><div class="grid kpis"><div class="card"><div class="kpi-label">Clientes analizados</div><div class="kpi-value">${fmt(D.meta.clientes)}</div><div class="kpi-note">Solo OFICINA GDL con historial</div></div><div class="card"><div class="kpi-label">Cobertura cliente</div><div class="kpi-value">${pct(cov)}</div><div class="kpi-note">${active} de ${hist} categorías activas</div></div><div class="card"><div class="kpi-label">Categorías perdidas</div><div class="kpi-value">${lost}</div><div class="kpi-note">Cliente seleccionado</div></div><div class="card"><div class="kpi-label">Categorías catálogo</div><div class="kpi-value">${fmt(D.meta.categorias)}</div><div class="kpi-note">Base maestra productos</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Pérdida por categoría</h2>${barList(top,'clientes_perdidos')}</div><div class="card"><h2>Participación por giro</h2>${barList(D.giroStats.slice(0,10),'clientes','giro')}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Categorías que dejó de comprar: ${c.nombre}</h2><div class="tbl-wrap"><table><thead><tr><th>Categoría</th><th>Estatus</th><th>Riesgo</th></tr></thead><tbody>${c.categorias_perdidas.map(cat=>`<tr><td><b>${cat}</b></td><td>Sin compra en junio</td><td><span class="risk ${riskClass(1,3)}">Revisar</span></td></tr>`).join('')||'<tr><td colspan="3">Sin categorías perdidas detectadas.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Matriz de actividad por categoría</h2>${heatMap(c)}</div></div>`}
function searchDashClient(q){q=(q||'').toUpperCase();let c=D.clients.find(x=>x.nombre.toUpperCase().includes(q)||x.codigo.toUpperCase().includes(q));if(c){selectedClient=c;setTimeout(renderAll,0)}}
function barList(arr,field,labelField='categoria'){let max=Math.max(...arr.map(x=>x[field]||0),1);return arr.map(x=>`<div class="barrow"><div class="barlabel" title="${x[labelField]}">${x[labelField]}</div><div class="barbg"><div class="bar" style="width:${(x[field]||0)/max*100}%"></div></div><b>${fmt(x[field])}</b></div>`).join('')}
function heatMap(c){let cats=c.categorias.slice(0,10);let html='<div class="heat"><b>Categoría</b>'+monthNames.slice(1).map(m=>`<b class="mini">${m}</b>`).join('');cats.forEach(cat=>{html+=`<div class="mini" title="${cat}">${cat.substring(0,24)}</div>`;for(let m=1;m<=6;m++){let has=c.productos.some(p=>p.categoria==cat && p.meses.includes(m));html+=`<div class="cell ${has?'good':'bad'}">${has?'✓':'-'}</div>`}});return html+'</div>'}
function renderClientes(){const c=currentClient();$('clientes').innerHTML=`<div class="top"><div class="title"><h1>Clientes</h1><p>Expediente comercial por categoría</p></div><div class="filters"><input id="clientSearch" class="input" placeholder="Buscar cliente o código" oninput="renderClientList(this.value)"></div></div><div class="client-layout"><div class="card client-list" id="clientList"></div><div class="grid"><div class="card"><h2>${c.nombre}</h2><p class="muted">Código: <b>${c.codigo||'Sin código'}</b> · Giro: <b>${c.giro}</b></p><h3>Categorías activas</h3>${c.categorias_activas.map(x=>`<span class="pill">${x}</span>`).join('')||'<p class="muted">Sin categorías activas.</p>'}<h3 style="margin-top:14px">Categorías perdidas</h3>${c.categorias_perdidas.map(x=>`<span class="pill" style="background:#fee2e2;color:#991b1b">${x}</span>`).join('')||'<p class="muted">Sin categorías perdidas.</p>'}</div><div class="grid two"><div class="card"><h2>Productos que consume</h2><div class="scroll-panel">${productCards(c.productos_activos)}</div></div><div class="card"><h2>Productos que dejó de comprar</h2><div class="scroll-panel">${productCards(c.productos_perdidos,true)}</div></div></div></div></div>`;renderClientList('')}
function renderClientList(q){q=(q||'').toUpperCase();let list=D.clients.map((c,idx)=>({c,idx})).filter(o=>o.c.nombre.toUpperCase().includes(q)||o.c.codigo.toUpperCase().includes(q)).slice(0,500);$('clientList').innerHTML=list.map(o=>{let c=o.c;return `<div class="client-item ${c===selectedClient?'active':''}" onclick="selectedClient=D.clients[${o.idx}];renderAll()"><b>${c.nombre}</b><div class="muted mini">${c.codigo} · ${c.giro}</div><div class="mini">Activas: ${c.categorias_activas.length} · Perdidas: ${c.categorias_perdidas.length}</div></div>`}).join('')}
function productCards(products,lost=false){return products.slice(0,80).map((p,i)=>`<div class="product-card"><div class="prod-code">${p.codigo||'S/COD'}</div><div><div class="prod-name">${p.producto}</div><div class="prod-cat">${p.categoria}${lost&&p.ultimo_mes?' · Última compra: '+monthNames[p.ultimo_mes]:''}</div></div><button class="btn secondary" onclick='addOrder(${JSON.stringify(p).replace(/'/g,"&#39;")},"${lost?'Recuperado':'Histórico'}")'>Agregar</button></div>`).join('')||'<p class="muted">Sin productos.</p>'}
function renderPedido(){const c=currentClient();$('pedido').innerHTML=`<div class="top"><div class="title"><h1>Captura rápida de pedido SAP</h1><p>${c.nombre} · ${c.codigo||''}</p></div><button class="btn" onclick="openModal()">+ Agregar producto del catálogo</button></div><div class="order-grid"><div class="card"><h2>Productos por categoría</h2><div class="filters"><select id="orderCat" onchange="renderOrderProducts()"><option value="">Todas las categorías</option>${c.categorias.map(x=>`<option>${x}</option>`).join('')}</select><input id="orderSearch" class="input" placeholder="Buscar producto" oninput="renderOrderProducts()"></div><div id="orderProducts" class="scroll-panel" style="margin-top:12px"></div></div><div class="card"><h2>Resumen del pedido</h2><div id="orderTable" class="tbl-wrap"></div><textarea id="comments" rows="3" placeholder="Comentarios de Atención a Clientes" style="width:100%;margin-top:10px"></textarea><div class="order-actions"><button class="btn green" onclick="createOrder()">Crear pedido</button><button class="btn secondary" onclick="copySAP()">Copiar SAP</button><button class="btn secondary" onclick="printOrder()">Imprimir</button><button class="btn red" onclick="order=[];renderPedido()">Vaciar pedido</button></div><h3 style="margin-top:14px">Enviar a sucursal</h3><div class="branch-buttons">${Object.keys(D.branches).map(b=>`<button class="btn secondary" onclick="sendMail('${b}')">${b}</button>`).join('')}</div><h3 style="margin-top:14px">Vista correo / WhatsApp</h3><div id="orderSummary" class="summary"></div></div></div>`;renderOrderProducts();renderOrderSummary()}
function renderOrderProducts(){const c=currentClient();let q=($('orderSearch')?.value||'').toUpperCase(), cat=$('orderCat')?.value||'';let products=c.productos.filter(p=>(!cat||p.categoria==cat)&&(!q||p.producto.toUpperCase().includes(q)||String(p.codigo).toUpperCase().includes(q)));$('orderProducts').innerHTML=productCards(products)}
function addOrder(p,tipo='Histórico'){let existing=order.find(x=>x.codigo==p.codigo && x.tipo==tipo);if(existing)existing.piezas++;else order.push({codigo:p.codigo||'',producto:p.producto,categoria:p.categoria,piezas:1,tipo});renderPedido()}
function renderOrderSummary(){let c=currentClient();let rows=order.map((x,i)=>`<tr><td>${x.codigo}</td><td>${x.producto}</td><td><input class="qty" type="number" min="1" value="${x.piezas}" onchange="order[${i}].piezas=Number(this.value)||1;renderOrderSummary()"></td><td>${x.tipo}</td><td><button class="btn secondary" onclick="order.splice(${i},1);renderPedido()">Quitar</button></td></tr>`).join('')||'<tr><td colspan="5">Sin productos agregados.</td></tr>';$('orderTable').innerHTML=`<table><thead><tr><th>Código</th><th>Descripción</th><th>Piezas</th><th>Tipo</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;$('orderSummary').textContent=orderText()}
function orderText(){let c=currentClient();let comments=$('comments')?.value||'';let lines=[`PEDIDO TOYO FOODS`,`Cliente: ${c.nombre}`,`Código: ${c.codigo||''}`,`Atendió: ${$('userSelect').value}`,``,`PIEZAS | CÓDIGO | PRODUCTO`];order.forEach(x=>lines.push(`${x.piezas} | ${x.codigo} | ${x.producto}`));lines.push('',`Total productos: ${order.length}`,`Total piezas: ${order.reduce((a,b)=>a+(Number(b.piezas)||0),0)}`);if(comments)lines.push('',`Comentarios:`,comments);return lines.join('\n')}
function copySAP(){navigator.clipboard.writeText(order.map(x=>`${x.codigo}\t${x.producto}\t${x.piezas}`).join('\n'));alert('Pedido copiado para SAP')}
function createOrder(){let c=currentClient();let comments=$('comments')?.value||'';let d=new Date().toLocaleString('es-MX');order.forEach(x=>{if(x.tipo=='Recuperado'||x.tipo=='Nuevo'){recoveryLog.push({fecha:d,usuario:$('userSelect').value,cliente:c.nombre,codigoCliente:c.codigo,codigo:x.codigo,producto:x.producto,categoria:x.categoria,tipo:x.tipo,piezas:x.piezas,comentarios:comments})}});localStorage.setItem('atn_recovery',JSON.stringify(recoveryLog));alert('Pedido guardado. Recuperaciones/nuevos productos registrados.');renderSeguimiento()}
function sendMail(branch){let to=D.branches[branch].join(';');let subject=encodeURIComponent('Pedido Toyo Foods - '+currentClient().nombre);let body=encodeURIComponent(orderText());location.href=`mailto:${to}?subject=${subject}&body=${body}`}
function printOrder(){let w=window.open('','_blank');w.document.write(`<pre style="font-family:Arial;font-size:13px;white-space:pre-wrap">${orderText()}</pre>`);w.print()}
function openModal(){ $('modal').classList.add('open'); $('catalogCat').innerHTML='<option value="">Todas</option>'+D.allCategories.map(c=>`<option>${c}</option>`).join(''); renderCatalog()}
function closeModal(){ $('modal').classList.remove('open')}
function renderCatalog(){let q=($('catalogSearch')?.value||'').toUpperCase(), cat=$('catalogCat')?.value||'';let products=D.products.filter(p=>(!cat||p.categoria==cat)&&(!q||p.producto.toUpperCase().includes(q)||String(p.codigo).toUpperCase().includes(q))).slice(0,200);$('catalogList').innerHTML=products.map(p=>`<div class="product-card"><div class="prod-code">${p.codigo}</div><div><div class="prod-name">${p.producto}</div><div class="prod-cat">${p.categoria}</div></div><button class="btn" onclick='addOrder(${JSON.stringify(p).replace(/'/g,"&#39;")},"Nuevo");closeModal()'>Agregar</button></div>`).join('')}
function renderSeguimiento(){let agg={};recoveryLog.forEach(r=>{agg[r.usuario]=agg[r.usuario]||{rec:0,nue:0,piezas:0}; if(r.tipo=='Nuevo')agg[r.usuario].nue++; else agg[r.usuario].rec++; agg[r.usuario].piezas+=Number(r.piezas)||0});let rows=Object.keys(agg).map(u=>`<tr><td>${u}</td><td>${agg[u].rec}</td><td>${agg[u].nue}</td><td>${agg[u].piezas}</td></tr>`).join('')||'<tr><td colspan="4">Sin pedidos guardados todavía.</td></tr>';let hist=recoveryLog.slice().reverse().map(r=>`<tr><td>${r.fecha}</td><td>${r.usuario}</td><td>${r.cliente}</td><td>${r.categoria}</td><td>${r.producto}</td><td>${r.tipo}</td><td>${r.piezas}</td></tr>`).join('')||'<tr><td colspan="7">Sin historial.</td></tr>';$('seguimiento').innerHTML=`<div class="top"><div class="title"><h1>Seguimiento Atención a Clientes</h1><p>Recuperación y productos nuevos generados desde pedido</p></div><button class="btn secondary" onclick="exportRecovery()">Exportar CSV</button></div><div class="grid two"><div class="card"><h2>Recuperación por persona</h2><div class="tbl-wrap"><table><thead><tr><th>Atención</th><th>Recuperados</th><th>Nuevos</th><th>Piezas</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card"><h2>Indicadores</h2><div class="grid three"><div><div class="kpi-label">Productos recuperados</div><div class="kpi-value">${recoveryLog.filter(x=>x.tipo=='Recuperado').length}</div></div><div><div class="kpi-label">Productos nuevos</div><div class="kpi-value">${recoveryLog.filter(x=>x.tipo=='Nuevo').length}</div></div><div><div class="kpi-label">Piezas</div><div class="kpi-value">${recoveryLog.reduce((a,b)=>a+(Number(b.piezas)||0),0)}</div></div></div></div></div><div class="card" style="margin-top:16px"><h2>Historial diario de recuperación</h2><div class="tbl-wrap" style="max-height:420px"><table><thead><tr><th>Fecha</th><th>Atención</th><th>Cliente</th><th>Categoría</th><th>Producto</th><th>Tipo</th><th>Piezas</th></tr></thead><tbody>${hist}</tbody></table></div></div>`}
function exportRecovery(){let csv='Fecha,Usuario,Cliente,CodigoCliente,Codigo,Producto,Categoria,Tipo,Piezas,Comentarios\n'+recoveryLog.map(r=>[r.fecha,r.usuario,r.cliente,r.codigoCliente,r.codigo,r.producto,r.categoria,r.tipo,r.piezas,r.comentarios].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='seguimiento_recuperacion.csv';a.click()}
init();
</script></body></html>
